okhttp-coroutines = { module = "com.squareup.okhttp3:okhttp-coroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3" }
review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "review" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
urldetector = { module = "com.linkedin.urls:url-detector", version.ref = "urldetector" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "dagger-hilt-android" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }
