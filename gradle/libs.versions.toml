[versions]
agp = "9.4.0"
androidx-activity = "1.13.0"
androidx-compose = "2026.08.00"
androidx-core = "1.19.0"
androidx-datastore = "1.2.1"
androidx-lifecycle = "2.11.0"
dagger-hilt-android = "2.60.1"
junit = "6.1.3"
kluent = "1.73"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
ksp = "2.3.11"
ktlint = "1.8.0"
material = "1.14.0"
mockk = "1.14.11"
okhttp = "5.5.0"
review = "2.0.2"
timber = "5.0.1"
turbine = "1.2.1"
urldetector = "0.1.17"
versions = "0.61.0"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidx-activity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidx-compose" }
androidx-compose-foundation-layout-android = { group = "androidx.compose.foundation", name = "foundation-layout-android" }
